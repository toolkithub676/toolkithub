<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text Case Converter - ToolKitHub</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:30px;
max-width:600px;
margin:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:150px;
padding:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
margin:5px;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Text Case Converter</h2>

<textarea id="text"></textarea>

<br>

<button onclick="upperCase()">UPPERCASE</button>
<button onclick="lowerCase()">lowercase</button>
<button onclick="capitalize()">Capitalize</button>
<button onclick="sentenceCase()">Sentence case</button>

</div>

<script>

function upperCase(){

let text=document.getElementById("text");

text.value=text.value.toUpperCase();

}

function lowerCase(){

let text=document.getElementById("text");

text.value=text.value.toLowerCase();

}

function capitalize(){

let text=document.getElementById("text");

text.value=text.value.replace(/\b\w/g,function(l){return l.toUpperCase()});

}

function sentenceCase(){

let text=document.getElementById("text");

text.value=text.value.charAt(0).toUpperCase()+text.value.slice(1).toLowerCase();

}

</script>

</body>
</html>
