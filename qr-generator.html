<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - ToolKitHub</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:30px;
max-width:500px;
margin:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:80%;
padding:10px;
margin-top:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 20px;
margin-top:10px;
border-radius:5px;
cursor:pointer;
}

#qrcode{
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>QR Code Generator</h2>

<p>Enter text or URL</p>

<input type="text" id="qrtext" placeholder="Enter text or link">

<br>

<button onclick="generateQR()">Generate QR</button>

<div id="qrcode"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

function generateQR(){

document.getElementById("qrcode").innerHTML="";

var text=document.getElementById("qrtext").value;

if(text===""){
alert("Enter text first");
return;
}

new QRCode(document.getElementById("qrcode"),{
text:text,
width:200,
height:200
});

}

</script>

</body>
</html>
